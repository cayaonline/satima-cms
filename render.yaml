# Free web hosting; PostgreSQL is hosted separately on Neon's Free plan.
services:
  - type: web
    name: satima-cms
    runtime: node
    region: frankfurt
    plan: free
    numInstances: 1
    buildCommand: npm ci --prefix app --omit=dev --ignore-scripts
    startCommand: node app/scripts/start-hosted.mjs
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: CMS_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
