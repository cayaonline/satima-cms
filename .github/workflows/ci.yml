name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    name: Node application tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: satima_cms
          POSTGRES_USER: satima_admin
          POSTGRES_PASSWORD: ci-only-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satima_admin -d satima_cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CMS_PASSWORD: ci-only-synthetic-password
      CMS_PORT: 3000
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: satima_cms
      PGUSER: satima_app
      PGPASSWORD: ci-only-synthetic-password
      TEST_ISOLATED_DATABASE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate isolated CI database and configure the application role
        run: |
          python3 database/scripts/migrate.py | psql -U satima_admin -v ON_ERROR_STOP=1
          psql -U satima_admin -v ON_ERROR_STOP=1 -c "ALTER ROLE satima_app PASSWORD 'ci-only-synthetic-password';"
      - name: Start application for HTTP integration tests
        run: |
          node app/server.mjs > "$RUNNER_TEMP/satima-app.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/satima-app.log"
          exit 1
      - run: npm test --prefix app
      - name: Check database integrity
        run: psql -U satima_admin -v ON_ERROR_STOP=1 -f database/tests/integrity.sql
